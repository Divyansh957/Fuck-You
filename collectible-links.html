<!DOCTYPE html>

    <style>

        * {

        body {
            margin: 0;
            font-family: 'Arquitecta', sans-serif;
            background: #f5f5f5;
            color: #111;
        }


        /* HEADER */

        header {
            width: 100%;
            padding: 18px 25px;
            background: #111;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {

        }

        .menu-btn {
            background: white;
            color: #111;
            border: none;
            border-radius: 8px;

            font-size: 25px;
            padding: 5px 12px;

            cursor: pointer;
        }


        /* MENU */

        .menu {
            display: none;

            position: absolute;
            right: 20px;
            top: 70px;

            background: #111;
            width: 190px;

            border-radius: 10px;
            overflow: hidden;

            z-index: 10;
        }

        .menu a {
            display: block;

            color: white;
            text-decoration: none;

            padding: 15px;

            border-bottom: 1px solid #444;

            font-size: 18px;
        }

        .menu a:hover {
            background: #333;
        }


        /* TITLE */

        .title {
            text-align: center;
            padding: 45px 20px 25px;
        }

        .title h1 {
            font-size: 42px;
            margin: 0 0 10px;
        }

        .title p {
            font-size: 18px;
            margin: 0;
        }


        /* LINKS */

        .links-container {
            max-width: 700px;
            margin: auto;
            padding: 20px;
        }

        .link-box {
            background: white;

            margin-bottom: 15px;

            padding: 18px 20px;

            border-radius: 10px;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;
        }

        .link-name {
            font-size: 18px;
            font-weight: bold;
        }

        .open-link {
            background: #111;
            color: white;

            text-decoration: none;

            padding: 10px 18px;

            border-radius: 7px;

            font-size: 15px;

            white-space: nowrap;
        }

        .open-link:hover {
            background: #444;
        }


        /* FOOTER */

        footer {
            background: #111;
            color: white;

            text-align: center;

            padding: 25px;

            margin-top: 30px;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            .logo {
                font-size: 20px;
            }

            .title h1 {
                font-size: 34px;
            }

            .links-container {
                padding: 12px;
            }

            .link-box {
                padding: 15px;
            }

            .link-name {
                font-size: 16px;
            }

            .open-link {

</head>
