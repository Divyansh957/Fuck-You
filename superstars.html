        /* GALLERY */

        .gallery {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 18px;

            padding: 25px;

            max-width: 850px;

            margin: auto;
        }


        /* PHOTO BOX */

        .gallery-item {
            background: white;

            border-radius: 12px;

            overflow: hidden;

            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
        }


        /* PHOTO SIZE */

        .gallery-item img {
            width: 100%;

            height: 260px;

            object-fit: cover;

            display: block;
        }


        /* CAPTION */

        .caption {
            text-align: center;

            padding: 10px;

            font-size: 16px;

            font-weight: bold;
        }


        /* FOOTER */

        footer {

            color: white;

            text-align: center;

            padding: 25px;

            margin-top: 30px;
        }

            .caption {
